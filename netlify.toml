[build]
  # Build command
  command = "npm run build"

  # Directory with the static files
  publish = "dist"

  # Environment variables during build
  [build.environment]
    NODE_VERSION = "20"

# Production API keys are set via Netlify's environment variables UI
# (Site configuration > Environment variables) so they are never committed
# to the repository. Required variables:
#   VITE_PROTOMAPS_API_KEY  - Protomaps key restricted to https://dronedetect.netlify.app
#
# Local development uses .env.development (gitignored) - see .env.example.


# SPA redirect rules - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
